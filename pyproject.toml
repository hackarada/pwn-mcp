[project]
name = "pwn-mcp"
version = "0.1.0"
description = "MCP server exposing web, API, and SPA security testing tools for CTFs, VDP, and authorized internal testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.11.0",
    "httpx>=0.28.0",
    "dnspython>=2.7.0",
    "cryptography>=43.0.0",
    "mitmproxy>=10.0",
    "websockets>=14.0",
    "psycopg[binary,pool]>=3.2",
]

[project.urls]
Repository = "https://github.com/hackarada/pwn-mcp"

[project.scripts]
pwn-mcp = "pwn_mcp.server:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
